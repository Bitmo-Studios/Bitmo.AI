<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitmo AI - Next-Gen Desktop Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d0e12;
            color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .background-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 199, 250, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(30, 31, 32, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 44px 36px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            max-width: 480px;
            width: 100%;
        }

        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(168, 199, 250, 0.3);
            border-radius: 18px;
            font-size: 2rem;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #FFFFFF;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        p {
            color: #E2E8F0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #F8FAFC;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #A8C7FA, #7CACC5);
            color: #001D3D;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(168, 199, 250, 0.4);
            transition: all 0.25s ease;
            margin-bottom: 12px;
        }

        .btn-download:hover {
            box-shadow: 0 6px 28px rgba(168, 199, 250, 0.6);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #B8D4FF, #8CBCC5);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #94A3B8;
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <div class="card">
        <div class="icon-badge">✨</div>
        <h1>Bitmo AI</h1>
        <p>A fast, dark-themed desktop assistant built for smooth performance, quick tools, and instant answers right from your Windows desktop.</p>

        <div class="features">
            <span class="tag">⚡ Ultra Fast</span>
            <span class="tag">🎨 Dark Mode</span>
            <span class="tag">💻 Windows (.exe)</span>
        </div>

        <a href="Bitmo.exe" download class="btn-download">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download Bitmo (.exe)
        </a>

        <div class="footer-note">Compatible with Windows 10 & 11</div>
    </div>

</body>
</html>
