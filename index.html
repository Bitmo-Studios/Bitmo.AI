<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitmo AI</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #131314;
            color: #FFFFFF;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 1. LEFT SIDEBAR */
        .sidebar {
            width: 240px;
            background-color: #1E1F20;
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #A8C7FA;
            margin-bottom: 20px;
            padding-left: 5px;
        }

        .new-chat-btn {
            background-color: #2B2C2E;
            color: #FFFFFF;
            border: none;
            border-radius: 20px;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            margin-bottom: 25px;
        }

        .new-chat-btn:hover { background-color: #37393B; }

        .history-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #8E918F;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-left: 5px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            background: transparent;
            color: #C4C7C5;
            border: none;
            text-align: left;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover { background-color: #2B2C2E; }

        /* 2. MAIN CHAT CONTAINER */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 950px;
            margin: 0 auto;
            width: 100%;
        }

        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 10px;
            margin-bottom: 15px;
        }

        /* 3. CHAT BUBBLES */
        .bubble-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .bubble-wrapper.user { align-self: flex-end; }
        .bubble-wrapper.bot { align-self: flex-start; }

        .msg-frame {
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .user .msg-frame { background-color: #2B2C2E; color: #FFFFFF; }
        .bot .msg-frame { background-color: #1E1F20; color: #FFFFFF; }

        .sender-lbl {
            font-size: 0.75rem;
            font-weight: 700;
            color: #8E918F;
            margin-bottom: 4px;
        }

        .speak-btn {
            margin-top: 8px;
            background-color: #2B2C2E;
            color: #A8C7FA;
            border: none;
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            align-self: flex-start;
        }

        .speak-btn:hover { background-color: #37393B; }

        /* 4. BOTTOM INPUT BAR */
        .input-frame {
            background-color: #1E1F20;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 6px 10px 6px 20px;
            height: 50px;
        }

        .prompt-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #FFFFFF;
            font-size: 0.95rem;
        }

        .send-button {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background-color: #A8C7FA;
            color: #003062;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-button:hover { background-color: #7CACC5; }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <div class="logo">✨ Bitmo AI</div>
        <button class="new-chat-btn" id="new-chat-btn">➕ New Chat</button>
        <div class="history-title">Recent Chats</div>
        <div class="history-list" id="history-scroll"></div>
    </div>

    <!-- MAIN CHAT AREA -->
    <div class="chat-container">
        <div class="chat-scroll" id="chat-scroll">
            <div class="bubble-wrapper bot">
                <div class="sender-lbl">Bitmo</div>
                <div class="msg-frame">Hello! 👋 I'm Bitmo. Ask me anything!</div>
            </div>
        </div>

        <div class="input-frame">
            <input type="text" id="prompt-input" class="prompt-input" placeholder="Enter a prompt here..." autocomplete="off">
            <button class="send-button" id="send-button">➔</button>
        </div>
    </div>

    <script>
        // PASTE YOUR GEMINI API KEY HERE
        const API_KEY = "YOUR_API_KEY_HERE";

        const chatScroll = document.getElementById("chat-scroll");
        const historyScroll = document.getElementById("history-scroll");
        const promptInput = document.getElementById("prompt-input");
        const sendButton = document.getElementById("send-button");
        const newChatBtn = document.getElementById("new-chat-btn");

        let chatHistoryCount = 0;

        function speakText(text) {
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/\*\*/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            window.speechSynthesis.speak(utterance);
        }

        function renderBubble(sender, text) {
            const isUser = sender === "You";
            const wrapper = document.createElement("div");
            wrapper.className = `bubble-wrapper ${isUser ? 'user' : 'bot'}`;

            const senderDiv = document.createElement("div");
            senderDiv.className = "sender-lbl";
            senderDiv.innerText = sender;
            wrapper.appendChild(senderDiv);

            const cleanedText = text.replace(/\*\*(.*?)\*\*/g, '$1');
            const msgDiv = document.createElement("div");
            msgDiv.className = "msg-frame";
            msgDiv.innerText = cleanedText;
            wrapper.appendChild(msgDiv);

            if (!isUser) {
                const speakBtn = document.createElement("button");
                speakBtn.className = "speak-btn";
                speakBtn.innerText = "🔊 Speak";
                speakBtn.onclick = () => speakText(cleanedText);
                wrapper.appendChild(speakBtn);
            }

            chatScroll.appendChild(wrapper);
            chatScroll.scrollTop = chatScroll.scrollHeight;
        }

        function startNewChat() {
            chatScroll.innerHTML = "";
            chatHistoryCount = 0;
            renderBubble("Bitmo", "Hello! 👋 I'm Bitmo. Ask me anything!");
        }

        async function processMessage() {
            const userText = promptInput.value.trim();
            if (!userText) return;

            renderBubble("You", userText);
            promptInput.value = "";

            // Render Loading Indicator
            const loadingWrapper = document.createElement("div");
            loadingWrapper.className = "bubble-wrapper bot";
            loadingWrapper.innerHTML = '<div class="sender-lbl">Bitmo</div><div class="msg-frame" style="font-style: italic; color: #8E918F;">Bitmo is searching the web... 🔍</div>';
            chatScroll.appendChild(loadingWrapper);
            chatScroll.scrollTop = chatScroll.scrollHeight;

            const today = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

            const requestBody = {
                contents: [{ parts: [{ text: userText }] }],
                systemInstruction: {
                    parts: [{ text: `Today's date is ${today}. The current year is 2026. Always search the web dynamically to retrieve accurate real-time factual information.` }]
                },
                tools: [{ googleSearch: {} }]
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                chatScroll.removeChild(loadingWrapper);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    renderBubble("Bitmo", aiResponse);

                    if (chatHistoryCount === 0) {
                        const chatTitle = userText.length > 18 ? userText.substring(0, 18) + "..." : userText;
                        const histBtn = document.createElement("button");
                        histBtn.className = "history-item";
                        histBtn.innerText = `💬 ${chatTitle}`;
                        historyScroll.appendChild(histBtn);
                        chatHistoryCount++;
                    }
                } else if (data.error) {
                    renderBubble("Bitmo", `Error: ${data.error.message}`);
                }
            } catch (err) {
                chatScroll.removeChild(loadingWrapper);
                renderBubble("Bitmo", `Error connecting to API: ${err.message}`);
            }
        }

        // Event Listeners
        sendButton.addEventListener("click", processMessage);

        promptInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                processMessage();
            }
        });

        newChatBtn.addEventListener("click", startNewChat);
    </script>
</body>
</html>
