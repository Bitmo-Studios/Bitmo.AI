<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitmo AI - Next-Gen Desktop Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d0e12;
            color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Subtle glowing background aura */
        .background-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(168, 199, 250, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(30, 31, 32, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 48px 36px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 440px;
            width: 100%;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 199, 250, 0.3);
        }

        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(168, 199, 250, 0.2);
            border-radius: 18px;
            font-size: 2rem;
            margin-bottom: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #F2F5F9;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        p {
            color: #9EA3A7;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Feature Pills */
        .features {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #C4C7C5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #A8C7FA, #7CACC5);
            color: #001D3D;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(168, 199, 250, 0.3);
            transition: all 0.25s ease;
        }

        .btn-download:hover {
            box-shadow: 0 6px 28px rgba(168, 199, 250, 0.5);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #B8D4FF, #8CBCC5);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #626669;
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <div class="card">
        <div class="icon-badge">✨</div>
        <h1>Bitmo AI</h1>
        <p>A fast, dark-themed desktop assistant built for smooth performance, quick tools, and instant answers right from your Windows desktop.</p>

        <div class="features">
            <span class="tag">⚡ Ultra Fast</span>
            <span class="tag">🎨 Dark Mode</span>
            <span class="tag">💻 Windows Standalone</span>
        </div>

<a href="https://github.com/Bitmo-Studios/Bitmo.AI/archive/refs/tags/0.0.1.zip" class="btn-download">

        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    Download Bitmo.exe

        <div class="footer-note">Compatible with Windows 10 & 11</div>

</body>
</html>
